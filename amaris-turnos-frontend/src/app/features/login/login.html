<div class="contenedor-login">
  <h1>Sistema de Turnos - Acceso</h1>

  <form [formGroup]="form" (ngSubmit)="enviar()">
    <label for="nombreUsuario">Usuario</label>
    <input id="nombreUsuario" type="text" formControlName="nombreUsuario" />

    @if (form.get('nombreUsuario')?.invalid && form.get('nombreUsuario')?.touched) {
      <p class="error-campo">El usuario es obligatorio.</p>
    }

    <label for="password">Contraseña</label>
    <input id="password" type="password" formControlName="password" />

    @if (form.get('password')?.invalid && form.get('password')?.touched) {
      <p class="error-campo">La contraseña es obligatoria.</p>
    }

    @if (errorMensaje()) {
      <p class="error-general">{{ errorMensaje() }}</p>
    }

    <button type="submit" [disabled]="cargando()">
      {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
    </button>
  </form>
</div>
